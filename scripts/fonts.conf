<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The pandoc/extra image has no system fonts: let rsvg-convert use TeX Live's Latin Modern Sans
     for the diagrams' Helvetica, Arial and sans-serif text (readme_pdf.sh sets FONTCONFIG_FILE). -->
<fontconfig>
  <dir>/opt/texlive/texdir/texmf-dist/fonts/opentype/public/lm</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>Helvetica</family><prefer><family>Latin Modern Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Latin Modern Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Latin Modern Sans</family></prefer></alias>
</fontconfig>
