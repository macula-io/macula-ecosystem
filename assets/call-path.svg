<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a call travels</title>
  <desc id="d">The caller finds the provider in the distributed directory, then sends the call to the station the provider is connected to. The station forwards it. With sealing, the payload is encrypted to the provider's key, so the station sees only routing information.</desc>
  <rect width="860" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">How a call travels</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect x="40" y="130" width="160" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Caller</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#14532d">signs the request</text>
  <circle cx="430" cy="165" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="161" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Station</text>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#1e3a8a">routes only</text>
  <rect x="660" y="130" width="160" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Provider</text>
  <text x="740" y="180" text-anchor="middle" font-size="12" fill="#14532d">verifies, answers</text>
  <line x1="200" y1="165" x2="368" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="490" y1="165" x2="656" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="235" y="140" width="110" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="290" y="156" text-anchor="middle" font-size="12" fill="#78350f">sealed payload</text>
  <rect x="515" y="140" width="110" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="570" y="156" text-anchor="middle" font-size="12" fill="#78350f">sealed payload</text>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#334155">1. The caller looks the provider up in the distributed directory (DHT)</text>
  <text x="430" y="90" text-anchor="middle" font-size="13" fill="#334155">and dials the station that provider is connected to: one hop.</text>
  <text x="430" y="250" text-anchor="middle" font-size="13" fill="#334155">2. Each link is QUIC with a hybrid post-quantum key exchange (ML-KEM-1024).</text>
  <text x="430" y="272" text-anchor="middle" font-size="13" fill="#334155">3. When the provider has opted in, the payload is sealed to its own key:</text>
  <text x="430" y="292" text-anchor="middle" font-size="13" fill="#334155">the station sees who talks to whom and when, not what they say.</text>
</svg>
