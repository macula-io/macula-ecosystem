<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <linearGradient id="faberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="toolsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="reckonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="hecateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48"/>
      <stop offset="100%" style="stop-color:#be123c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="960" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#fff">
    Four Ecosystems, One Platform
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
    Independent projects that compose into a distributed application platform
  </text>

  <!-- ============================================ -->
  <!-- MACULA ECOSYSTEM (center, main)              -->
  <!-- ============================================ -->

  <!-- Macula outer border -->
  <rect x="280" y="100" width="640" height="350" rx="20" fill="#0c4a6e" opacity="0.2"/>
  <rect x="280" y="100" width="640" height="350" rx="20" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>

  <!-- Macula header -->
  <text x="600" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">
    Macula Ecosystem
  </text>
  <text x="600" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7dd3fc">
    macula-io &#183; Decentralized Infrastructure
  </text>

  <!-- Mesh Networking section -->
  <rect x="310" y="170" width="580" height="120" rx="14" fill="#0c4a6e" opacity="0.4"/>
  <rect x="310" y="170" width="580" height="120" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
  <text x="600" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
    MESH NETWORKING
  </text>

  <rect x="340" y="210" width="520" height="65" rx="10" fill="url(#meshGrad)"/>
  <text x="600" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fff">macula</text>
  <text x="600" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#bae6fd">HTTP/3 over QUIC &#183; DHT Discovery &#183; PubSub &#183; RPC &#183; NAT Traversal &#183; UCAN Security</text>

  <!-- Tools / Orchestration section -->
  <rect x="310" y="305" width="580" height="130" rx="14" fill="#451a03" opacity="0.3"/>
  <rect x="310" y="305" width="580" height="130" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <text x="600" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">
    ORCHESTRATION &amp; TOOLS
  </text>

  <rect x="340" y="345" width="170" height="70" rx="8" fill="url(#toolsGrad)"/>
  <text x="425" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">bc_gitops</text>
  <text x="425" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">Mesh App Orchestration</text>

  <rect x="525" y="345" width="170" height="70" rx="8" fill="url(#toolsGrad)"/>
  <text x="610" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">macula_console</text>
  <text x="610" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">Management Console</text>

  <rect x="710" y="345" width="150" height="70" rx="8" fill="url(#toolsGrad)"/>
  <text x="785" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">macula_os</text>
  <text x="785" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">Edge Operating System</text>

  <!-- ============================================ -->
  <!-- RECKON ECOSYSTEM (bottom-left)               -->
  <!-- ============================================ -->

  <rect x="30" y="510" width="530" height="280" rx="20" fill="#2e1065" opacity="0.25"/>
  <rect x="30" y="510" width="530" height="280" rx="20" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>

  <!-- Reckon header -->
  <text x="295" y="542" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#a78bfa">
    Reckon Ecosystem
  </text>
  <text x="295" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">
    reckon-db-org &#183; Event Sourcing &amp; CQRS
  </text>

  <!-- Reckon packages -->
  <rect x="60" y="580" width="230" height="55" rx="8" fill="url(#reckonGrad)"/>
  <text x="175" y="605" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fff">reckon_db</text>
  <text x="175" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#e9d5ff">Event Store &#183; Khepri/Ra &#183; Raft</text>

  <rect x="310" y="580" width="220" height="55" rx="8" fill="url(#reckonGrad)"/>
  <text x="420" y="605" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fff">reckon_gater</text>
  <text x="420" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#e9d5ff">Gateway &#183; Shared Types &#183; API</text>

  <rect x="60" y="650" width="230" height="55" rx="8" fill="url(#reckonGrad)"/>
  <text x="175" y="675" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fff">evoq</text>
  <text x="175" y="692" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#e9d5ff">CQRS Framework &#183; Aggregates &#183; Events</text>

  <rect x="310" y="650" width="220" height="55" rx="8" fill="url(#reckonGrad)"/>
  <text x="420" y="675" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fff">reckon_evoq</text>
  <text x="420" y="692" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#e9d5ff">Adapter &#183; Evoq &#8596; ReckonDB</text>

  <!-- reckon_nifs (small, optional) -->
  <rect x="160" y="720" width="270" height="45" rx="8" fill="#4c1d95" opacity="0.7"/>
  <rect x="160" y="720" width="270" height="45" rx="8" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <text x="295" y="743" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd">reckon_nifs</text>
  <text x="295" y="758" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a78bfa">Rust NIFs &#183; Optional Acceleration</text>

