# Regenerates FEATURES.md and pushes it to a branch (macula-ecosystem#1).
#
# This workflow never opens, approves or merges a pull request: it only pushes a branch.
# A member of the Macula team opens the pull request from that branch, and a person
# merges it. Do not add `gh pr`, auto-merge or an approving step here. main accepts
# pull requests only (ruleset "main: pull request only"), and auto-merge is off.
#
# Triggers:
#   push to register-export  the security register's CI delivered a new public export
#                            (data/security_register.json); regenerate on that branch
#   schedule, dispatch       new releases elsewhere; regenerate on branch features-update
name: features

on:
  push:
    branches: [register-export]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency:
  group: features
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=register-export" >> "$GITHUB_OUTPUT"
            echo "base=register-export" >> "$GITHUB_OUTPUT"
          else
            echo "name=features-update" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.base }}
          fetch-depth: 0

      - name: Skip until the first register export has landed
        id: ready
        run: |
          if [ -f data/security_register.json ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else
            echo "no data/security_register.json on ${{ steps.branch.outputs.base }}: nothing to generate"
            echo "go=0" >> "$GITHUB_OUTPUT"; fi

      - name: Test the generator
        if: steps.ready.outputs.go == '1'
        run: python3 -m unittest scripts/test_generate_features.py

      - name: Generate
        if: steps.ready.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURES_DENYLIST: ${{ secrets.FEATURES_DENYLIST }}
        run: python3 scripts/generate_features.py --out FEATURES.md

      - name: Commit and push the branch
        if: steps.ready.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add FEATURES.md
          if ! git diff --cached --quiet; then
            git commit -m "FEATURES.md: regenerate (${{ github.event_name }})"
            if [ "$BRANCH" = "register-export" ]; then git push origin "$BRANCH"; else git push --force origin "$BRANCH"; fi
          fi
          git fetch -q origin main
          if git diff --quiet origin/main HEAD; then echo "nothing differs from main"; exit 0; fi
          echo "Branch $BRANCH differs from main: a team member opens the pull request." >> "$GITHUB_STEP_SUMMARY"
