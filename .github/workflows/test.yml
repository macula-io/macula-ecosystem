name: test

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "features/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/test_generate_features.py
